operator:
  name: ViTAttention
  category: VisionAttention
  difficulty: L4
  formula: |
    q = Q x,  k = K x,  v = V x
    P = softmax(q k^T / sqrt(head_dim))
    y = O (P v)
  description: Vision Transformer 自注意力前向（query/key/value 同源），四个无偏置投影权重显式输入
  shape_support: 'x: [B, S, D]；q/k/v/out_proj_weight: [D, D]；y: [B, S, D]；约束 D % n_heads == 0'
  attrs:
  - name: n_heads
    type: int
    description: 注意力头数，须整除 d_model
    required: true
  inputs:
  - name: x
    description: 输入 token 序列，[B, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, S, D]'
  - name: q_proj_weight
    description: query 投影权重，[D, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[D, D]'
  - name: k_proj_weight
    description: key 投影权重，[D, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[D, D]'
  - name: v_proj_weight
    description: value 投影权重，[D, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[D, D]'
  - name: out_proj_weight
    description: 输出投影权重，[D, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[D, D]'
  outputs:
  - name: y
    description: 注意力输出，[B, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, S, D]'
  schema: vit_attention(Tensor x, Tensor q_proj_weight, Tensor k_proj_weight, Tensor v_proj_weight, Tensor out_proj_weight, int n_heads) -> Tensor y
