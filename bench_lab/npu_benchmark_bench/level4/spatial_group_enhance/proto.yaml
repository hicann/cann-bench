operator:
  name: SpatialGroupEnhance
  category: VisionAttention
  difficulty: L4
  formula: |
    xr    = x.view(B*G, C//G, H, W)
    avg   = adaptive_avg_pool2d(xr, 1)
    s     = sum_c(xr * avg, dim=1)                       # [B*G, H, W]
    t     = (s - mean(s)) / (std(s, unbiased=True) + 1e-5)
    t     = t.view(B, G, H, W) * weight + bias
    y     = xr * sigmoid(t.view(B*G, 1, H, W))
  description: 空间分组增强（SGE）前向：组内全局平均池化特征与逐位置特征相乘求和后按样本分组标准化，经逐组仿射与 sigmoid 得到空间门控
  shape_support: 'x: [B, C, H, W]；weight/bias: [1, groups, 1, 1]；y: [B, C, H, W]；要求 groups 整除 C'
  attrs:
  - name: groups
    type: int
    description: 通道分组数，须整除 C
    required: true
  inputs:
  - name: x
    description: 输入特征图 [B, C, H, W]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, C, H, W]'
  - name: weight
    description: 逐组缩放参数 [1, groups, 1, 1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1, groups, 1, 1]'
  - name: bias
    description: 逐组偏移参数 [1, groups, 1, 1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1, groups, 1, 1]'
  outputs:
  - name: y
    description: 输出特征图 [B, C, H, W]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, C, H, W]'
  schema: spatial_group_enhance(Tensor x, Tensor weight, Tensor bias, int groups) -> Tensor y
