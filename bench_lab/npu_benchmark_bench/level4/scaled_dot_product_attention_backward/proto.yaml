operator:
  name: ScaledDotProductAttentionBackward
  category: Attention
  difficulty: L4
  formula: |
    P = exp(scale * Q K^T - logsumexp)   # causal 时上三角置 0
    dV = P^T dO
    dP = dO V^T
    D  = rowsum(dO ⊙ O)
    dS = P ⊙ (dP - D)
    dQ = dS K scale
    dK = dS^T Q scale
  description: 融合缩放点积注意力反向：由前向保存的 logsumexp 重建 softmax 概率，计算 query/key/value 梯度，支持因果掩码
  shape_support: 'grad_output/query/key/value/attn_output: [B, H, S, D]；logsumexp: [B, H, S]；grad_query/grad_key/grad_value: [B, H, S, D]'
  attrs:
  - name: is_causal
    type: bool
    default: false
    description: 是否使用因果掩码（位置 i 只能看到 j <= i）
    required: false
  inputs:
  - name: grad_output
    description: 输出梯度 dO [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: query
    description: 前向 query 张量 [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: key
    description: 前向 key 张量 [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: value
    description: 前向 value 张量 [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: attn_output
    description: 前向注意力输出 O [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: logsumexp
    description: 前向 softmax 的 logsumexp [B, H, S]
    dtype:
    - float32
    shape: '[B, H, S]'
  outputs:
  - name: grad_query
    description: query 梯度 [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: grad_key
    description: key 梯度 [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  - name: grad_value
    description: value 梯度 [B, H, S, D]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, H, S, D]'
  schema: scaled_dot_product_attention_backward(Tensor grad_output, Tensor query, Tensor key, Tensor value, Tensor attn_output, Tensor logsumexp, bool is_causal=false) -> (Tensor grad_query, Tensor grad_key, Tensor grad_value)
