operator:
  name: TripletAttention
  category: VisionAttention
  difficulty: L4
  formula: |
    P = (kernel_size - 1) // 2
    z = cat([mean(t, dim=1, keepdim=True), max(t, dim=1, keepdim=True)], dim=1)
    gate(t) = t * sigmoid(ReLU(BN(conv2d(z, conv_w, conv_b, padding=P))))
    x_ch = gate(x.permute(0,3,1,2), ...).permute(0,2,3,1)     # C-H 交互
    x_cw = gate(x.permute(0,2,1,3), ...).permute(0,2,1,3)     # C-W 交互
    x_hw = gate(x, ...)                                       # H-W 交互
    y = (x_ch + x_cw + x_hw) / 3
  description: Triplet Attention 前向：C-H、C-W、H-W 三个分支分别经 Z-Pool、k x k 卷积、训练态 BatchNorm、ReLU 与 sigmoid 门控后取平均
  shape_support: 'x: [B, C, H, W]；每分支 conv_weight: [1, 2, kernel_size, kernel_size]；conv_bias/bn_weight/bn_bias: [1]；y: [B, C, H, W]'
  attrs:
  - name: kernel_size
    type: int
    description: 三个分支卷积核大小（奇数），padding = (kernel_size - 1) // 2
    required: true
  inputs:
  - name: x
    description: 输入特征图 [B, C, H, W]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, C, H, W]'
  - name: conv_ch_weight
    description: (C,H) 分支卷积权重 [1, 2, kernel_size, kernel_size]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1, 2, kernel_size, kernel_size]'
  - name: conv_ch_bias
    description: (C,H) 分支卷积偏置 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: bn_ch_weight
    description: (C,H) 分支 BatchNorm 仿射权重 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: bn_ch_bias
    description: (C,H) 分支 BatchNorm 仿射偏置 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: conv_cw_weight
    description: (C,W) 分支卷积权重 [1, 2, kernel_size, kernel_size]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1, 2, kernel_size, kernel_size]'
  - name: conv_cw_bias
    description: (C,W) 分支卷积偏置 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: bn_cw_weight
    description: (C,W) 分支 BatchNorm 仿射权重 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: bn_cw_bias
    description: (C,W) 分支 BatchNorm 仿射偏置 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: conv_hw_weight
    description: (H,W) 分支卷积权重 [1, 2, kernel_size, kernel_size]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1, 2, kernel_size, kernel_size]'
  - name: conv_hw_bias
    description: (H,W) 分支卷积偏置 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: bn_hw_weight
    description: (H,W) 分支 BatchNorm 仿射权重 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  - name: bn_hw_bias
    description: (H,W) 分支 BatchNorm 仿射偏置 [1]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[1]'
  outputs:
  - name: y
    description: 输出特征图 [B, C, H, W]
    dtype:
    - float16
    - float32
    - bfloat16
    shape: '[B, C, H, W]'
  schema: triplet_attention(Tensor x, Tensor conv_ch_weight, Tensor conv_ch_bias, Tensor bn_ch_weight, Tensor bn_ch_bias, Tensor conv_cw_weight, Tensor conv_cw_bias, Tensor bn_cw_weight, Tensor bn_cw_bias, Tensor conv_hw_weight, Tensor conv_hw_bias, Tensor bn_hw_weight, Tensor bn_hw_bias, int kernel_size) -> Tensor y
