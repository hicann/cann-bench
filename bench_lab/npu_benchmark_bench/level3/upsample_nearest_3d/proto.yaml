operator:
  name: UpsampleNearest3D
  category: Vision
  difficulty: L3
  formula: |
    y[n, c, i, j, k] = input[n, c, floor(i * D_in / D_out), floor(j * H_in / H_out),
                              floor(k * W_in / W_out)]
  description: 最近邻 3D 上采样，按目标尺寸逐元素取最近邻源坐标
  shape_support: 'input: [N, C, D_in, H_in, W_in], y: [N, C, D_out, H_out, W_out]; 输出尺寸由 output_size 属性给出'
  attrs:
  - name: output_size
    type: ListInt
    description: 目标输出尺寸 (D_out, H_out, W_out)
    required: true
  inputs:
  - name: input
    description: 输入 5D 张量 [N, C, D_in, H_in, W_in]
    dtype:
    - float16
    - float32
  outputs:
  - name: y
    description: 上采样输出 [N, C, D_out, H_out, W_out]
    dtype:
    - float16
    - float32
  schema: upsample_nearest_3d(Tensor input, int[] output_size) -> Tensor y
