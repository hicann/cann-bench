operator:
  name: expand_into_jagged_permute
  category: FusedComposite
  difficulty: L1
  formula: output_permute[output_offsets[i]:output_offsets[i+1]] = arange(input_offsets[permute[i]],
    input_offsets[permute[i]] + output_offsets[i+1] - output_offsets[i])
  description: Expand a table-level permutation into flattened jagged indices using
    paired monotone offset arrays.
  shape_support: 'permute: [P]; input_offsets: [P_PLUS_1]; output_offsets: [P_PLUS_1];
    output: [OUT]'
  attrs:
  - name: output_size
    type: int
    default: 0
    enum:
    - 0
    - 96
    - 128
    - 129
    - 160
    - 177
    - 193
    - 211
    - 223
    - 257
    - 289
    - 301
    - 4001
    - 4096
    - 4101
    - 524193
    - 524288
    - 524293
    description: Flattened output length
  inputs:
  - name: permute
    description: Permutation indices over jagged rows
    shape: '[P]'
    dtype:
    - int32
  - name: input_offsets
    description: Source jagged row offsets
    shape: '[P_PLUS_1]'
    dtype:
    - int32
  - name: output_offsets
    description: Destination jagged row offsets
    shape: '[P_PLUS_1]'
    dtype:
    - int32
  outputs:
  - name: output_permute
    description: Expanded flattened indices
    shape: '[OUT]'
    dtype:
    - int32
  schema: expand_into_jagged_permute(Tensor permute, Tensor input_offsets, Tensor
    output_offsets, int output_size) -> Tensor
constraints: {}
