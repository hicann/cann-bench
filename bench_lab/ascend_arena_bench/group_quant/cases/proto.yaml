operator:
  name: group_quant
  category: misc
  difficulty: medium
  formula: y = round(x * scale[group] + offset)
  inputs:
  - name: x
    shape: '[S, H]'
    dtype:
    - float16
    - float32
    - bfloat16
  - name: scale
    shape: '[E, H]'
    dtype:
    - float16
    - float32
    - bfloat16
  - name: group_index
    shape: '[E]'
    dtype:
    - int32
    - int64
  - name: offset
    shape: '[1]'
    dtype:
    - float16
    - float32
    - bfloat16
    optional: true
  outputs:
  - name: y
    shape: '[S, H]'
    dtype:
    - int8
    precision_standard: quantized_integer_ae1
  attrs: []
  schema: group_quant(Tensor x, Tensor scale, Tensor group_index, Tensor? offset=None, int dst_type=2) -> Tensor y
constraints:
  dtype_equal:
  - - x
    - scale
  match:
  - source: scale.shape
    source_index: 0
    target: group_index.shape
    target_index: 0
  - source: scale.shape
    source_index: 1
    target: x.shape
    target_index: 1
  min_rank: 1
  max_rank: 2
coverage_axes:
  size:
  - S
  - M
  - L
  - zero
  rank:
  - 1D
  - 2D
  alignment:
  - aligned
  - misaligned
  - prime
  - zero
  value_range:
  - symmetric_small
  - symmetric_medium
  - symmetric_large
  - near_zero
  - zero
  attrs_signature:
  - <none>
coverage_skip:
  pairs:
  - - size
    - dtype
    - L
    - int32
  - - size
    - dtype
    - L
    - int64
