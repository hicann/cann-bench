operator:
  name: GroupedMatMulAlltoAllv
  category: FusedComposite
  difficulty: L4
  formula: 'gmmY = GroupedMatMul(gmmX, gmmWeight)

    unpermuteOut = Unpermute(gmmY)

    y = AllToAllv(unpermuteOut)

    mmY = mmX @ mmWeight (optional shared expert)

    '
  description: Grouped MatMul, Unpermute and AlltoAllv fusion with optional shared MatMul. Existing legacy cases
    are preserved; A5 cases use deterministic two-rank FP16/BF16 communication.
  shape_support: 'gmm_x: [A, H1], gmm_weight: [e, H1, N1] or [e, N1, H1] when trans_gmm_weight=true, mm_x: [BS,
    H2], mm_weight: [H2, N2] or [N2, H2] when trans_mm_weight=true; y: [BSK, N1], mm_y: [BS, N2]'
  precision_thresholds:
    float16: 0.005
    bfloat16: 0.005
  attrs:
  - name: mc2_distributed
    type: bool
    default: true
    description: Route this task through the cann-bench MC2 distributed runner.
  - name: world_size
    type: int
    description: Number of HCCL ranks.
  - name: e
    type: int
    description: Number of experts per card.
  - name: trans_gmm_weight
    type: bool
    default: false
    description: Whether gmm_weight is stored as [e, N1, H1] and should be transposed before GMM.
  - name: trans_mm_weight
    type: bool
    default: false
    description: Whether mm_weight is stored as [N2, H2] and should be transposed before MatMul.
  - name: mm_out
    type: bool
    default: false
    description: Whether shared expert mm output is present (mm_x and mm_weight are provided).
  - name: seed
    type: int
    default: 1
    description: Random seed for token distribution generation.
  - name: graph_type
    type: int
    default: 0
    description: Graph execution mode (0=single op, 1=static graph, 2=dynamic graph).
  - name: case_name
    type: str
    description: Original mc2_test legacy case name.
    required: false
  - name: mc2_accuracy_mode
    type: str
    description: A5 uses three_way.
    required: false
  - name: mc2_compare_dtype
    type: str
    description: A5 precision error statistics use float32.
    required: false
  - name: platform
    type: str
    description: A5 rows are restricted to Ascend 950DT.
    required: false
  - name: supported_devices
    type: list
    description: Accepted device tags for platform filtering.
    required: false
  - name: source
    type: str
    description: Operator source documenting platform and input constraints.
    required: false
  - name: token_counts
    type: list
    description: A5 C[source][destination][expert]; nonnegative counts with matching send/receive edges.
    required: false
  inputs:
  - name: gmm_x
    description: Input tensor for grouped matmul and all-to-allv communication.
    dtype:
    - float16
    - bfloat16
    shape: '[A, H1]'
    required: true
  - name: gmm_weight
    description: Weight tensor for grouped matmul.
    dtype:
    - float16
    - bfloat16
    shape: '[e, H1, N1] or [e, N1, H1]'
    required: true
  - name: send_counts
    description: Send counts for all-to-allv (int list of length world_size * e, derived from token distribution).
    dtype:
    - int32
    - int64
    shape: '[world_size * e]'
    required: true
  - name: recv_counts
    description: Receive counts for all-to-allv (int list of length world_size * e, derived from token distribution).
    dtype:
    - int32
    - int64
    shape: '[world_size * e]'
    required: true
  - name: mm_x
    description: Optional input for shared expert matmul.
    dtype:
    - float16
    - bfloat16
    shape: '[BS, H2]'
    optional: true
    required: false
  - name: mm_weight
    description: Optional weight for shared expert matmul.
    dtype:
    - float16
    - bfloat16
    shape: '[H2, N2] or [N2, H2]'
    optional: true
    required: false
  outputs:
  - name: y
    description: Final output after GMM, unpermute, and all-to-allv.
    dtype:
    - float16
    - bfloat16
    shape: '[BSK, N1]'
  - name: mm_y
    description: Optional shared expert matmul output.
    dtype:
    - float16
    - bfloat16
    shape: '[BS, N2]'
    optional: true
  schema: grouped_mat_mul_allto_allv(Tensor gmm_x, Tensor gmm_weight, str hcomm_info, int world_size, int[] send_counts,
    int[] recv_counts, Tensor? mm_x=None, Tensor? mm_weight=None, bool trans_gmm_weight=False, bool trans_mm_weight=False)
    -> (Tensor y, Tensor? mm_y)
  platform: Atlas A3 / Ascend 950DT (A5)
